<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<!-- Geist and Geist Mono, served from this site (static/fonts, SIL OFL; @font-face in
			src/app.css) and preloaded so they arrive before the text draws: no reflow when they
			load. Replaced Google Fonts in Session 3b (Lighthouse layout shift on long pages). -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/Geist-Variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/GeistMono-Variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<!-- Set the theme before first paint (no flash). Mirrors src/lib/stores/theme.js.
			Also marks <html class="js"> so no-JavaScript fallbacks can be shown with CSS. -->
		<script>
			document.documentElement.classList.add('js');
			(function () {
				try {
					var t = localStorage.getItem('jct-theme');
					if (t !== 'light' && t !== 'dark') {
						t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					document.documentElement.dataset.theme = t;
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
