# Runs on every pull request (and on main after a merge). No secrets, no deploys: it builds and
# checks the site on GitHub's machine only.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci && npm ci --prefix functions

      # The Firebase emulators (rules and function tests) need Java and the Firebase CLI.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firebase CLI
        run: npm install --global firebase-tools@15.32.1

      - name: Lint and formatting
        run: npm run lint

      # svelte-check and the label-config test
      - name: Check
        run: npm run check:code

      # The production-placeholder check: a warning on pull requests, a failure on main.
      # (Any production build, e.g. Vercel's, fails on its own while a placeholder is left.)
      - name: Placeholders
        run: node scripts/check-placeholders.mjs ${{ github.event_name == 'pull_request' && '--warn' || '' }}

      - name: Unit tests
        run: npm run test:unit

      # The email function's logic, with a fake Mailjet (no network).
      - name: Function tests
        run: npm run test:functions

      # firestore.rules on the Firestore emulator (project demo-jct).
      - name: Firestore rules tests
        run: npm run test:rules

      # The form's save through the rules, then the function on the emulators (email logged,
      # never sent).
      - name: Emulator flow tests
        run: npm run test:emulators

      # Builds the site, then: SEO registry, built head tags, every old URL (200 or one
      # permanent redirect), and the internal link check.
      - name: SEO and redirects
        run: npm run test:seo

      - name: Internal link check
        run: npm run check:links

      # Serves that build with `vite preview` and audits all 8 pages, 3 loads each (median):
      # SEO and Accessibility 100, Performance at least 90.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/reports
          if-no-files-found: ignore
